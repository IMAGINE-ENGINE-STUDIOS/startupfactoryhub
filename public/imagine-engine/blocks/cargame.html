<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#05060a;overflow:hidden;font-family:system-ui,sans-serif;color:#fafafa}canvas{display:block}
#hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;font-weight:700;pointer-events:none;text-shadow:0 1px 4px #000}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(5,6,10,.55)}
#ui button{background:#8b5cf6;color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:16px;cursor:pointer}
#pad{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
#pad button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1px solid #3f3f46;background:rgba(39,39,42,.7);color:#fff;font-size:22px}</style></head>
<body><div id="hud"><span id="sc">Score 0</span><span id="sp">0 km/h</span></div>
<div id="ui"><h2 id="h" style="margin:0">3D Street Racer</h2><p style="margin:0;color:#a1a1aa">Arrow keys / A-D to steer, W/Up to speed up. Dodge traffic.</p><button id="b">Start race</button></div>
<div id="pad"><button id="L">&lt;</button><button id="R">&gt;</button></div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x05060a);sc.fog=new THREE.Fog(0x05060a,30,140);
const cam=new THREE.PerspectiveCamera(65,1,.1,300);cam.position.set(0,5,9);cam.lookAt(0,0,-10);
sc.add(new THREE.HemisphereLight(0x8b5cf6,0x111111,1.1));const d=new THREE.DirectionalLight(0xffffff,1.2);d.position.set(5,10,5);sc.add(d);
const road=new THREE.Mesh(new THREE.PlaneGeometry(12,400),new THREE.MeshStandardMaterial({color:0x18181b}));road.rotation.x=-Math.PI/2;road.position.z=-150;sc.add(road);
const grid=new THREE.GridHelper(400,100,0x22d3ee,0x1e1b4b);grid.position.y=-.01;sc.add(grid);
const lines=[];for(let i=0;i<40;i++){for(const x of[-2,2]){const m=new THREE.Mesh(new THREE.BoxGeometry(.15,.02,2),new THREE.MeshBasicMaterial({color:0xfafafa}));m.position.set(x,.01,-i*8);sc.add(m);lines.push(m)}}
function car(col){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(1.6,.6,3),new THREE.MeshStandardMaterial({color:col,metalness:.5,roughness:.3}));b.position.y=.5;g.add(b);
const t=new THREE.Mesh(new THREE.BoxGeometry(1.3,.5,1.4),new THREE.MeshStandardMaterial({color:0x111827}));t.position.set(0,1,-.2);g.add(t);
for(const[x,z]of[[-.8,1],[.8,1],[-.8,-1],[.8,-1]]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.3,16),new THREE.MeshStandardMaterial({color:0x000000}));w.rotation.z=Math.PI/2;w.position.set(x,.35,z);g.add(w)}return g}
const me=car(0x8b5cf6);sc.add(me);
let traffic=[],run=false,speed=0,score=0,keys={},steer=0;
function size(){r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener("resize",size);size();
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
const hold=(id,v)=>{const el=document.getElementById(id);el.onpointerdown=()=>steer=v;el.onpointerup=el.onpointerleave=()=>steer=0};hold("L",-1);hold("R",1);
function start(){traffic.forEach(t=>sc.remove(t));traffic=[];speed=.4;score=0;me.position.x=0;run=true;document.getElementById("ui").style.display="none"}
document.getElementById("b").onclick=start;
function over(){run=false;document.getElementById("h").textContent="Crashed - score "+score;document.getElementById("b").textContent="Race again";document.getElementById("ui").style.display="flex";
try{(parent.__IEBus||window.__IEBus)?.emit?.("game:over",{score})}catch(e){}}
let last=performance.now();
(function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
if(run){const acc=keys.arrowup||keys.w;speed=Math.min(1.6,speed+(acc?.6:.08)*dt);const s=(keys.arrowleft||keys.a?-1:0)+(keys.arrowright||keys.d?1:0)+steer;
me.position.x=Math.max(-4.6,Math.min(4.6,me.position.x+s*9*dt));me.rotation.y=-s*.15;
lines.forEach(m=>{m.position.z+=speed*60*dt;if(m.position.z>10)m.position.z-=320});
if(Math.random()<dt*(1.2+score/40)){const c=car([0xef4444,0x22d3ee,0xf59e0b,0x22c55e][Math.floor(Math.random()*4)]);c.position.set([-4,0,4][Math.floor(Math.random()*3)],0,-140);c.rotation.y=Math.PI;sc.add(c);traffic.push(c)}
for(let i=traffic.length-1;i>=0;i--){const c=traffic[i];c.position.z+=speed*40*dt;
if(Math.abs(c.position.z-me.position.z)<2.8&&Math.abs(c.position.x-me.position.x)<1.6){over();break}
if(c.position.z>12){sc.remove(c);traffic.splice(i,1);score++}}
document.getElementById("sc").textContent="Score "+score;document.getElementById("sp").textContent=Math.round(speed*120)+" km/h"}
r.render(sc,cam)})(last);
</script></body></html>
