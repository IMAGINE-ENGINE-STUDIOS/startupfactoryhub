<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#09090b;color:#fafafa;font-family:system-ui,sans-serif;overflow:hidden}#w{position:relative;height:100%}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#bar{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;align-items:center}button{background:#8b5cf6;color:#fff;border:0;border-radius:999px;padding:10px 20px;cursor:pointer}#m{background:#18181bcc;padding:8px 12px;border-radius:999px;font-size:13px}</style></head>
<body><div id="w"><video id="v" playsinline muted></video><canvas id="c"></canvas><div id="bar"><button id="b">Start camera</button><span id="m">Motion: off</span></div></div>
<script>
var v=document.getElementById("v"),c=document.getElementById("c"),x=c.getContext("2d",{willReadFrequently:true}),prev=null,on=false;
document.getElementById("b").onclick=function(){navigator.mediaDevices.getUserMedia({video:true}).then(function(s){v.srcObject=s;v.play();on=true;document.getElementById("b").style.display="none"}).catch(function(){document.getElementById("m").textContent="Camera permission denied"})};
(function f(){requestAnimationFrame(f);if(!on||!v.videoWidth)return;var w=160,h=Math.round(160*v.videoHeight/v.videoWidth);c.width=w;c.height=h;x.drawImage(v,0,0,w,h);
var d=x.getImageData(0,0,w,h),n=0,minX=w,minY=h,maxX=0,maxY=0;
if(prev){for(var i=0;i<d.data.length;i+=4){if(Math.abs(d.data[i]-prev[i])+Math.abs(d.data[i+1]-prev[i+1])+Math.abs(d.data[i+2]-prev[i+2])>60){n++;var p=i/4,px=p%w,py=(p/w)|0;if(px<minX)minX=px;if(px>maxX)maxX=px;if(py<minY)minY=py;if(py>maxY)maxY=py}}}
prev=d.data.slice();x.clearRect(0,0,w,h);var pct=n/(w*h)*100;
if(pct>.5){x.strokeStyle="#22c55e";x.lineWidth=1.5;x.strokeRect(minX,minY,maxX-minX,maxY-minY)}
document.getElementById("m").textContent="Motion: "+pct.toFixed(1)+"%";try{parent.postMessage({ie:"state",key:"motion",value:pct},"*")}catch(e){}})();
</script></body></html>
